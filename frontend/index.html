<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyAgent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --amber:         #D97706;
      --amber-hover:   #B45309;
      --amber-subtle:  rgba(217, 119, 6, 0.08);
      --amber-ghost:   rgba(217, 119, 6, 0.05);
      --blue:          #2563EB;
      --green:         #059669;
      --green-subtle:  rgba(5, 150, 105, 0.08);
      --red:           #DC2626;
      --red-subtle:    rgba(220, 38, 38, 0.08);
      --yellow:        #B45309;
      --yellow-subtle: rgba(180, 83, 9, 0.08);
      --bg:            #FFFBEB;
      --surface:       #FFFFFF;
      --surface-hover: #FCF6F0;
      --glass:         rgba(255, 251, 235, 0.88);
      --glass-border:  rgba(217, 119, 6, 0.12);
      --border:        #EDE3D5;
      --border-light:  #F5EDE4;
      --fg:            #1A1A1A;
      --fg-secondary:  #5C5C5C;
      --fg-muted:      #8C8C8C;
      --code-bg:       #F8F3EC;
      --code-border:   #EDE3D5;
      --code-fg:       #B45309;

      /* 状态卡片专属色板 — 每类一色 */
      --c-think:   #D97706;  /* amber   思考过程 */
      --c-tool:    #06B6D4;  /* cyan    工具调用 */
      --c-micro:   #8C8C8C;  /* muted   微压缩   */
      --c-compact: #7C3AED;  /* violet  上下文压缩 */
      --c-bg:      #2563EB;  /* blue    后台任务通知 */
      --c-inbox:   #0F766E;  /* teal    收件箱   */
      --c-todo:    #BE123C;  /* rose    TODO提醒 */

      --c-think-subtle:   rgba(217,119,6,0.08);
      --c-tool-subtle:    rgba(6,182,212,0.08);
      --c-micro-subtle:   rgba(140,140,140,0.06);
      --c-compact-subtle: rgba(124,58,237,0.06);
      --c-bg-subtle:      rgba(37,99,235,0.06);
      --c-inbox-subtle:   rgba(15,118,110,0.06);
      --c-todo-subtle:    rgba(190,18,60,0.06);

      --radius-sm:     6px;
      --radius-md:     10px;
      --radius-lg:     14px;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #app { height: 100vh; display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
